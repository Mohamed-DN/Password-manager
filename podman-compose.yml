# ---------------------------------------------------------------------------
# M-DN Vault — podman-compose.yml (simplified for local dev)
# Usage: podman compose up -d --build
# ---------------------------------------------------------------------------

services:

  # =========================================================================
  # PostgreSQL — single instance for local dev
  # =========================================================================
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: inventory-db
    environment:
      POSTGRES_DB: vault_inventory_db
      POSTGRES_PASSWORD: ""
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vault_inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # =========================================================================
  # Backend API (Hono + Better Auth + PostgreSQL)
  # =========================================================================
  backend:
    build: ./backend
    container_name: inventory-api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: inventory-db
      DB_USER: inventory_app
      DB_PASSWORD: ""
      DB_NAME: vault_inventory_db
      DB_PORT: "5432"
      BETTER_AUTH_URL: http://localhost:5174
      BETTER_AUTH_SECRET: ""
      JWT_SECRET_KEY: M-DNVaultSuperSecret2026!xK9mP4qR7wZ2
    restart: unless-stopped

  # =========================================================================
  # Frontend (Vite build → Nginx serving static + reverse proxy to backend)
  # =========================================================================
  frontend:
    build: ./frontend
    container_name: inventory-ui
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

# ===========================================================================
# Named Volumes
# ===========================================================================
volumes:
  postgres_data:
