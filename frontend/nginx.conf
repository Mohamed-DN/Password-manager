server {
    listen 80;
    server_name localhost;

    # Proper MIME types for JS/CSS assets
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy — MUST come before the SPA fallback
    location /api/ {
        proxy_pass http://inventory-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
    }

    # Health check shortcut
    location /health {
        proxy_pass http://inventory-api:8000/health;
    }

    # Static assets — serve directly, fail if not found
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback — only for non-API, non-asset paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
